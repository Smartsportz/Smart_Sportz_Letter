<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSportz Letter Builder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="layout">
    <section class="panel controls">
      <div class="brand">
        <h1>Letter Builder</h1>
        <p>SmartSportz format generator</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-method="method1">Method 1</button>
        <button class="tab" data-method="method2">Method 2</button>
      </div>

      <form id="letter-form">
        <div class="position-control">
          <label>Letter Position</label>
          <div class="position-buttons">
            <button type="button" id="move-up" class="mini-btn">Up</button>
            <button type="button" id="move-down" class="mini-btn">Down</button>
          </div>
        </div>

        <div class="position-control">
          <div class="position-buttons">
            <button type="button" id="add-page" class="mini-btn">Add Page</button>
            <button type="button" id="remove-page" class="mini-btn">Remove Page</button>
          </div>
        </div>

        <div class="format-toolbar" aria-label="Body formatting">
          <button type="button" class="format-btn" data-command="bold"><b>B</b></button>
          <button type="button" class="format-btn" data-command="italic"><i>I</i></button>
          <button type="button" class="format-btn" data-command="underline"><u>U</u></button>
          <button type="button" class="format-btn" data-command="justifyLeft">Left</button>
          <button type="button" class="format-btn" data-command="justifyCenter">Center</button>
          <button type="button" class="format-btn" data-command="justifyRight">Right</button>
        </div>

        <div class="method method1">
          <label>Title
            <input type="text" id="m1-title" value="APPOINTMENT LETTER">
          </label>
          <label>From
            <textarea id="m1-from" rows="3">The Management,
SMARTSPORTZ.IN,
Bangalore, India</textarea>
          </label>
          <label>To
            <textarea id="m1-to" rows="3">To,
Mr. Rajesh Kumar,
Senior Sports Coordinator,
Bangalore</textarea>
          </label>
          <label>Subject
            <input type="text" id="m1-subject" value="SUB: Appointment as Senior Sports Coordinator">
          </label>
          <label>Body
            <div id="m1-body" class="rich-editor" contenteditable="true">We are pleased to offer you the position of Senior Sports Coordinator at SMARTSPORTZ.IN. Based on your experience and skills in managing athletic tournaments, we believe you will be a valuable asset to our organization.<br><br>Your roles and responsibilities will involve coordinating inter-school sports competitions, overseeing venue logistics, and promoting our youth fitness programs across regional centers.<br><br>Please sign and return the duplicate copy of this letter as a token of your acceptance of the terms and conditions outlined herein. We look forward to welcoming you to the SMARTSPORTZ.IN team.</div>
          </label>
          <label>Last Text
            <textarea id="m1-closing" rows="3">Yours faithfully,
XXX</textarea>
          </label>
        </div>

        <div class="method method2 hidden">
          <label>Title
            <input type="text" id="m2-title" value="OFFICIAL ANNOUNCEMENT">
          </label>
          <label>Dear
            <input type="text" id="m2-dear" value="Valued Sports Partner">
          </label>
          <label>Body
            <div id="m2-body" class="rich-editor" contenteditable="true">We are thrilled to announce the launch of our upcoming National Junior Championship 2026 sponsored by SMARTSPORTZ.IN.<br><br>Over the past year, our platform has empowered thousands of young athletes to play, compete, inspire, and succeed across multiple sports disciplines. This tournament brings together top talent from over 50 schools across the region.<br><br>We cordially invite your organization to participate as an official partner for this flagship event. Detailed event schedules and sponsorship kits are attached with this notice.</div>
          </label>
          <label>Last Text
            <textarea id="m2-closing" rows="3">Yours faithfully,
XXX</textarea>
          </label>
        </div>

        <div class="actions">
          <button type="button" id="pdf-btn" class="primary">Download PDF</button>
        </div>
      </form>
    </section>

    <section class="panel preview-wrap">
      <div id="preview-stack" class="preview-stack">
        <div id="preview" class="letter">
          <img class="letterhead" src="{{ url_for('static', filename='letterhead.jpg') }}" alt="SmartSportz letterhead">

          <div id="letter-content" class="letter-content">
            <div class="letter-body">
              <div id="preview-method1" class="preview-method">
                <h2 id="p-m1-title"></h2>
                <div class="meta-row"><span id="p-m1-from"></span></div>
                <div class="meta-row"><span id="p-m1-to"></span></div>
                <div class="meta-row subject"><span id="p-m1-subject"></span></div>
                <div id="p-m1-body" class="body-text"></div>
                <div id="p-m1-closing" class="closing-text"></div>
              </div>

              <div id="preview-method2" class="preview-method hidden">
                <h2 id="p-m2-title"></h2>
                <p id="p-m2-dear" class="dear"></p>
                <div id="p-m2-body" class="body-text"></div>
                <div id="p-m2-closing" class="closing-text"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
